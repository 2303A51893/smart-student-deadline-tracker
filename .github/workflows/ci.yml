name: DeadlineWise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Run Automated Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      USE_TEST_MEMORY_DB: "true"
      CI: "true"

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install root/backend dependencies
        run: npm ci

      - name: 📦 Install client/frontend dependencies
        run: npm --prefix client ci

      - name: 🧪 Execute automated backend test suite
        run: npm test

      - name: 🏗️ Build frontend production bundle (Vite)
        run: npm run build

      - name: 🔍 Verify production build output
        run: |
          test -f client/dist/index.html || exit 1
          echo "Production frontend build verified successfully."

      - name: 🛡️ Verify Node.js server syntax
        run: |
          node --check src/server.js
          node --check src/app.js
          node --check src/db/index.js
          node --check src/validation/taskValidator.js
          node --check src/utils/taskStatus.js
          echo "All server and utility modules passed syntax validation."
